
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Task Tracker - Project 1</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app-container">
    <header>
      <h1>Task Tracker</h1>
      <p>Keep track of your daily tasks</p>
    </header>

    <!-- Input Form Area -->
    <form id="task-form">
      <input 
        type="text" 
        id="task-input" 
        placeholder="Enter a new task..." 
        required 
      />
      <button type="submit" id="add-btn">Add Task</button>
    </form>

    <!-- Dynamic Task List -->
    <ul id="task-list"></ul>

    <!-- Task Counter -->
    <div class="footer">
      <span id="task-count">0 tasks remaining</span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
